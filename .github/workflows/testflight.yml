name: TestFlight

# main dalına her gönderimde otomatik derler ve TestFlight'a yükler.
# Actions sekmesinden "Run workflow" ile elle de başlatılabilir.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    env:
      SCHEME: MirissaFinans
      BUNDLE_ID: com.mirissalab.finans

    steps:
      - uses: actions/checkout@v4

      - name: Gizli anahtarlar tanımlı mı?
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          eksik=""
          if [ -z "$ASC_KEY_ID" ]; then eksik="$eksik ASC_KEY_ID"; fi
          if [ -z "$ASC_ISSUER_ID" ]; then eksik="$eksik ASC_ISSUER_ID"; fi
          if [ -z "$ASC_PRIVATE_KEY" ]; then eksik="$eksik ASC_PRIVATE_KEY"; fi
          if [ -z "$TEAM_ID" ]; then eksik="$eksik APPLE_TEAM_ID"; fi
          if [ -n "$eksik" ]; then
            echo "::error::Şu GitHub secret'ları eksik:$eksik"
            echo "Settings → Secrets and variables → Actions bölümünden ekle."
            echo "Ayrıntılar için README'deki 'TestFlight'a yayınlama' bölümüne bak."
            exit 1
          fi
          echo "Bütün anahtarlar tanımlı."

      - name: Xcode sürümü
        run: xcodebuild -version

      - name: Hesaplama motorunun testleri
        working-directory: MirissaKit
        run: swift test

      - name: Xcode projesini üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API anahtarını hazırla
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/.appstoreconnect/private_keys/
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Arşiv imzasız alınır. İmzalama dağıtım adımında yapılır: arşiv
      # sırasında Xcode "iOS App Development" profili aramaya kalkıyor,
      # ekipte kayıtlı cihaz olmadığı için de bulamıyor. App Store dağıtımı
      # için development profiline zaten ihtiyaç yok.
      - name: Arşivle (imzasız)
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project MirissaFinans.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MirissaFinans.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: IPA çıkar
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/MirissaFinans.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -lh "$RUNNER_TEMP/export"

      - name: TestFlight'a yükle
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Yüklenen dosya: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Hata olursa günlükleri sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-loglari
          path: |
            ~/Library/Logs/gym
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
