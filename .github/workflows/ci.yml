name: Kontrol

# Her gönderimde: testler + iOS derlemesi.
# İmzalama gerektirmez, gizli anahtar istemez.
on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'onizleme/**'
  pull_request:
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Hesaplama motorunun testleri
        working-directory: MirissaKit
        run: swift test

      - name: Xcode projesini üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iOS için derle (imzasız)
        run: |
          xcodebuild build \
            -project MirissaFinans.xcodeproj \
            -scheme MirissaFinans \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
