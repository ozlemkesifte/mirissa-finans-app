name: Kontrol

# Testler + iOS derlemesi. İmzalama gerektirmez, gizli anahtar istemez.
#
# Her gönderimde çalışmaz: main'e her gönderimde TestFlight işi zaten
# derliyor ve testler gönderimden önce yerelde çalıştırılıyor. Her
# gönderimde ikinci bir macOS işi açmak Actions dakikalarını iki katına
# çıkarıyordu (özel depoda macOS dakikası 10 kat sayılır) ve harcama
# limitinin dolmasına yol açtı. Yalnızca PR'da ve elle çalışır.
on:
  pull_request:
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Hesaplama motorunun testleri
        working-directory: MirissaKit
        run: swift test

      - name: Xcode projesini üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: iOS için derle (imzasız)
        run: |
          xcodebuild build \
            -project MirissaFinans.xcodeproj \
            -scheme MirissaFinans \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
